version: '3.8'
name: crime-map

services:

  marklogic:
    image: "marklogicdb/marklogic-db:11.1.0-centos-1.1.0"
    platform: linux/amd64
    environment:
      - INSTALL_CONVERTERS=true
      - MARKLOGIC_INIT=true
      - MARKLOGIC_ADMIN_USERNAME=ML_USERNAME
      - MARKLOGIC_ADMIN_PASSWORD=ML_PASSWORD
    volumes:
      - ./docker/marklogic/logs:/var/opt/MarkLogic/Logs
    ports:
      - 8000-8002:8000-8002
      - 8079:8079
